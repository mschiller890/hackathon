<title>Hackathon trénink</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
/* Layout: one column, big touch targets. Header counters, filter chips, one card at a time. Dark single look. */
:root {
  --bg: #070a12; --panel: #0d1424; --panel2: #121c31; --line: #20304e; --text: #e3ecfa; --dim: #8497b8;
  --cyan: #5fd4e8; --green: #6ee7a1; --amber: #ffb347; --red: #ff6b6b; --pink: #ff8fb1;
  --f-display: "Chakra Petch", "Arial Narrow", sans-serif; --f-data: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 16px/1.5 -apple-system, "SF Pro Text", "Segoe UI", Roboto, Arial, sans-serif; min-height: 100vh;
  padding-block: 16px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
h1 { font-family: var(--f-display); font-size: 30px; line-height: 1; margin: 0; text-transform: uppercase; letter-spacing: .05em; } h1 span { color: var(--amber); }
.sub { color: var(--dim); font-size: 13px; margin-top: 4px; }
.counts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.cnt { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; }
.cnt b { display: block; font-family: var(--f-display); font-size: 26px; line-height: 1.1; font-variant-numeric: tabular-nums; } .cnt span { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
.tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--line); }
.tabs button { flex: 1; font: inherit; font-family: var(--f-display); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--dim); background: transparent; border: 0; border-bottom: 3px solid transparent; padding: 12px 6px; cursor: pointer; }
.tabs button.on { color: var(--text); border-bottom-color: var(--amber); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font: inherit; font-size: 14px; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; cursor: pointer; min-height: 40px; }
.chip.on { border-color: var(--cyan); background: rgba(95,212,232,.14); color: #fff; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 14px; min-height: 340px; }
.card.danger { border-color: rgba(255,179,71,.7); box-shadow: 0 0 0 1px rgba(255,179,71,.25); }
.badges { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }
.badge { border: 1px solid currentColor; border-radius: 3px; padding: 2px 8px; } .b-who { color: var(--cyan); } .b-dng { color: var(--amber); } .b-id { color: var(--dim); } .b-ok { color: var(--green); } .b-no { color: var(--red); }
.q { font-family: var(--f-display); font-size: 24px; line-height: 1.25; font-weight: 600; text-wrap: balance; }
.timer { height: 6px; background: var(--panel2); border-radius: 3px; overflow: hidden; } .timer i { display: block; height: 100%; width: 100%; background: var(--green); transform-origin: left; }
.timer.late i { background: var(--red); }
.tl { font-size: 12px; color: var(--dim); font-family: var(--f-data); display: flex; justify-content: space-between; }
.ans { background: var(--panel2); border-left: 4px solid var(--green); border-radius: 4px; padding: 12px 14px; font-size: 17px; }
.src { font-family: var(--f-data); font-size: 12px; color: var(--dim); overflow-wrap: anywhere; }
details.full { font-size: 15px; } details.full summary { cursor: pointer; color: var(--cyan); padding: 6px 0; } details.full p { margin: 6px 0 0; color: #cfdbf0; }
.row { display: flex; gap: 10px; flex-wrap: wrap; } .row > * { flex: 1 1 140px; }
.btn { font: inherit; font-weight: 700; font-size: 17px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel2); color: var(--text); padding: 14px; min-height: 52px; cursor: pointer; }
.btn.go { border-color: var(--cyan); color: var(--cyan); } .btn.ok { border-color: var(--green); color: var(--green); background: rgba(110,231,161,.1); } .btn.no { border-color: var(--red); color: var(--red); background: rgba(255,107,107,.1); }
.btn.small { font-size: 14px; min-height: 40px; padding: 8px 12px; font-weight: 500; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.score { font-family: var(--f-display); font-size: 56px; line-height: 1; } .miss { border-top: 1px solid var(--line); padding-top: 10px; }
.miss .mq { font-weight: 700; margin-bottom: 4px; } .miss .ma { color: #cfdbf0; font-size: 15px; }
.empty { color: var(--dim); padding: 12px 0; }
.foot { color: var(--dim); font-size: 12px; text-align: center; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header><h1>Hackathon <span>trénink</span></h1><div class="sub">Otázky poroty a pravdivé odpovědi na 15 sekund. Jen čísla z results/ a docs/.</div></header>
  <div class="counts"><div class="cnt"><b id="cOk" style="color:var(--green)">0</b><span>umím</span></div><div class="cnt"><b id="cNo" style="color:var(--red)">0</b><span>neumím</span></div><div class="cnt"><b id="cNew">0</b><span>nezkoušeno</span></div></div>
  <nav class="tabs" id="tabs"><button data-m="cards" class="on" type="button">Karty</button><button data-m="exam" type="button">Zkouška</button><button data-m="weak" type="button">Neumím</button></nav>
  <div class="chips" id="filters"></div>
  <main id="view"></main>
  <div class="foot">Odpovědi se ukládají jen v tomto prohlížeči. Neznáš-li? Řekni: "Tohle jsme neměřili." a pokračuj tím, co měřeno bylo.</div>
</div>

<script>
(function () {
  var CARDS = /*CARDS*/[];
  var $ = function (id) { return document.getElementById(id); };
  function el(t, c, x) { var e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; }
  var mem = {}; function load() { try { return JSON.parse(localStorage.getItem("trenink-v1") || "{}"); } catch (e) { return mem; } }
  var st = load(); function save() { try { localStorage.setItem("trenink-v1", JSON.stringify(st)); } catch (e) { mem = st; } }
  var f = { who: "vše", weak: false, danger: false }, mode = "cards", deck = [], idx = 0, shown = false, T0 = 0, tick = null, exam = null;
  var WHOS = ["vše", "IPP fyzik", "ML", "organizátor"];
  function pool() { return CARDS.filter(function (c) { return (f.who === "vše" || c.who === f.who) && (!f.weak || st[c.id] === "no") && (!f.danger || c.danger); }); }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function counts() { var ok = 0, no = 0; CARDS.forEach(function (c) { if (st[c.id] === "ok") ok++; else if (st[c.id] === "no") no++; }); $("cOk").textContent = ok; $("cNo").textContent = no; $("cNew").textContent = CARDS.length - ok - no; }
  function rebuild(keep) { deck = pool(); if (!keep) idx = 0; if (idx >= deck.length) idx = 0; shown = false; start(); }
  function chips() {
    var box = $("filters"); box.textContent = "";
    WHOS.forEach(function (w) { var b = el("button", "chip" + (f.who === w ? " on" : ""), w === "vše" ? "Všichni" : w); b.type = "button"; b.addEventListener("click", function () { f.who = w; chips(); rebuild(); render(); }); box.appendChild(b); });
    [["weak", "jen neumím"], ["danger", "jen ★ nebezpečné"]].forEach(function (p) { var b = el("button", "chip" + (f[p[0]] ? " on" : ""), p[1]); b.type = "button"; b.addEventListener("click", function () { f[p[0]] = !f[p[0]]; chips(); rebuild(); render(); }); box.appendChild(b); });
    var s = el("button", "chip", "Zamíchat"); s.type = "button"; s.addEventListener("click", function () { deck = shuffle(pool()); idx = 0; shown = false; start(); render(); }); box.appendChild(s);
    box.style.display = mode === "weak" ? "none" : "flex";
  }
  function start() { T0 = Date.now(); clearInterval(tick); tick = setInterval(function () { var i = document.querySelector(".timer i"), tt = $("tl"); if (!i) return; var left = Math.max(0, 20 - (Date.now() - T0) / 1000); i.style.transform = "scaleX(" + (left / 20) + ")"; i.parentNode.classList.toggle("late", left <= 0); if (tt) tt.textContent = left > 0 ? Math.ceil(left) + " s" : "čas vypršel"; }, 150); }
  function mark(c, v) { st[c.id] = v; save(); counts(); }
  function cardView(c, pos, total, onMark) {
    var box = el("div", "card" + (c.danger ? " danger" : "")), b = el("div", "badges");
    b.appendChild(el("span", "badge b-who", c.who)); if (c.danger) b.appendChild(el("span", "badge b-dng", "★ nebezpečná")); b.appendChild(el("span", "badge b-id", c.id + (c.also.length ? " · " + c.also.join(" · ") : "")));
    if (st[c.id]) b.appendChild(el("span", "badge " + (st[c.id] === "ok" ? "b-ok" : "b-no"), st[c.id] === "ok" ? "umím" : "neumím")); box.appendChild(b);
    box.appendChild(el("div", "q", c.q));
    var tm = el("div", "timer"); tm.appendChild(el("i")); box.appendChild(tm); var tl = el("div", "tl"); tl.appendChild(el("span", "", "karta " + pos + " z " + total)); var tt = el("span", "", "20 s"); tt.id = "tl"; tl.appendChild(tt); box.appendChild(tl);
    if (!shown) { var r = el("button", "btn go", "Ukázat odpověď"); r.type = "button"; r.addEventListener("click", function () { shown = true; render(); }); box.appendChild(r); }
    else {
      box.appendChild(el("div", "ans", c.a));
      if (c.full) { var d = el("details", "full"); d.appendChild(el("summary", "", "Celá odpověď")); d.appendChild(el("p", "", c.full)); box.appendChild(d); }
      box.appendChild(el("div", "src", "Zdroj: " + c.src));
      var row = el("div", "row"), no = el("button", "btn no", "Neumím"), ok = el("button", "btn ok", "Umím"); no.type = ok.type = "button";
      no.addEventListener("click", function () { onMark(c, "no"); }); ok.addEventListener("click", function () { onMark(c, "ok"); }); row.appendChild(no); row.appendChild(ok); box.appendChild(row);
    }
    return box;
  }
  function render() {
    var v = $("view"); v.textContent = ""; counts();
    if (mode === "cards") {
      if (!deck.length) { v.appendChild(el("div", "empty", "Žádné karty pro tento filtr. Zkus jiný filtr nebo vypni „jen neumím“.")); return; }
      var c = deck[idx]; v.appendChild(cardView(c, idx + 1, deck.length, function (cc, val) { mark(cc, val); if (f.weak && val === "ok") { deck = pool(); if (idx >= deck.length) idx = 0; } else idx = (idx + 1) % Math.max(1, deck.length); shown = false; start(); render(); }));
      var nav = el("div", "row"); nav.style.marginTop = "10px"; [["‹ Předchozí", -1], ["Přeskočit ›", 1]].forEach(function (p) { var b = el("button", "btn small", p[0]); b.type = "button"; b.addEventListener("click", function () { idx = (idx + p[1] + deck.length) % deck.length; shown = false; start(); render(); }); nav.appendChild(b); }); v.appendChild(nav);
    } else if (mode === "exam") {
      if (!exam) { var p = el("div", "panel"); p.appendChild(el("div", "q", "Zkouška: 10 náhodných karet")); p.appendChild(el("div", "sub", "Losuje se z karet podle zvoleného filtru. U každé máš 20 sekund, odpovíš nahlas a pak si ověříš, jestli to bylo správně.")); var g = el("button", "btn go", "Spustit zkoušku"); g.type = "button"; g.addEventListener("click", function () { var d = shuffle(pool()).slice(0, 10); if (!d.length) return; exam = { deck: d, i: 0, ok: 0, miss: [] }; shown = false; start(); render(); }); p.appendChild(g); v.appendChild(p); return; }
      if (exam.i >= exam.deck.length) { var s = el("div", "panel"); s.appendChild(el("div", "label", "Výsledek")); s.appendChild(el("div", "score", exam.ok + " z " + exam.deck.length)); if (!exam.miss.length) s.appendChild(el("div", "sub", "Všechno umíš.")); exam.miss.forEach(function (c) { var m = el("div", "miss"); m.appendChild(el("div", "mq", c.q)); m.appendChild(el("div", "ma", c.a)); s.appendChild(m); }); var again = el("button", "btn go", "Zkusit znovu"); again.type = "button"; again.addEventListener("click", function () { exam = null; render(); }); s.appendChild(again); v.appendChild(s); return; }
      v.appendChild(cardView(exam.deck[exam.i], exam.i + 1, exam.deck.length, function (c, val) { mark(c, val); if (val === "ok") exam.ok++; else exam.miss.push(c); exam.i++; shown = false; start(); render(); }));
    } else {
      var w = CARDS.filter(function (c) { return st[c.id] === "no"; }), p2 = el("div", "panel");
      p2.appendChild(el("div", "label", "Karty, které ještě neumíš")); p2.appendChild(el("div", "score", String(w.length)));
      if (!w.length) p2.appendChild(el("div", "sub", "Zatím nic. Označ karty tlačítkem Neumím a objeví se tady."));
      w.forEach(function (c) { var m = el("div", "miss"); m.appendChild(el("div", "mq", (c.danger ? "★ " : "") + c.q)); m.appendChild(el("div", "ma", c.a)); m.appendChild(el("div", "src", c.id + " · " + c.who + " · " + c.src)); p2.appendChild(m); });
      if (w.length) { var dr = el("button", "btn go", "Procvičit jen tyhle"); dr.type = "button"; dr.addEventListener("click", function () { f = { who: "vše", weak: true, danger: false }; setMode("cards"); }); p2.appendChild(dr); }
      v.appendChild(p2);
    }
  }
  function setMode(m) { mode = m; Array.prototype.forEach.call($("tabs").querySelectorAll("button"), function (b) { b.classList.toggle("on", b.dataset.m === m); }); if (m !== "exam") exam = null; chips(); rebuild(); render(); }
  Array.prototype.forEach.call($("tabs").querySelectorAll("button"), function (b) { b.addEventListener("click", function () { setMode(b.dataset.m); }); });
  document.addEventListener("keydown", function (e) { if (e.key === " " && !shown && (mode === "cards" || (mode === "exam" && exam && exam.i < exam.deck.length))) { e.preventDefault(); shown = true; render(); } });
  deck = shuffle(pool()); chips(); start(); render();
})();
</script>
