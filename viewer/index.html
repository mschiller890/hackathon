<script>
"use strict";
const D = window.VIEWER;
if (!D) { document.body.style.display = "block"; document.body.innerHTML = '<p class="fatal">Chybí soubor data.js. Vytvoří se příkazem analysis/export_viewer_data.py.</p>'; throw new Error("data.js missing"); }
const $ = (s) => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const COL = { true: css("--true"), pred: css("--pred"), grid: css("--grid"), muted: css("--muted"), band: css("--band"), border: css("--border") };
// The prediction is the shipped model (data.js made from the cache of ipp1_final.py) or, as a fallback, the baseline network (out-of-fold predictions).
const SHIPPED = D.model === "shipped";
const TXT = SHIPPED
  ? { pred: "Vybraný model", chip: "Vybraný model", a: "Vybraný model (učený bez šumu), zašuměná měření", b: "Model učený se šumem, zašuměná měření", an: "vybraný model", bn: "model se šumem", as: "vybraný", bs: "se šumem",
      legend: "Černá = rekonstrukce tvaru plazmatu ústavem, červeně = předpověď vybraného modelu z 24 magnetických čidel (body; obrys model nepředpovídá)",
      legendNoise: "Černá = rekonstrukce ústavu, barevně = dva modely na zašuměných měřeních", lens: "Lupa: kde se model liší", axisTile: "Chyba osy, vybraný model", th: "Vybraný model",
      limWarn: "Limiterový snímek: bod dotyku s limiterem je nejméně přesná veličina." }
  : { pred: "Předpověď sítě", chip: "Předpověď", a: "Běžná síť, zašuměná měření", b: "Odolná síť, zašuměná měření", an: "běžná síť", bn: "odolná síť", as: "běžná", bs: "odolná",
      legend: "Černá = rekonstrukce tvaru plazmatu ústavem, červeně = předpověď sítě z 24 magnetických čidel", legendNoise: "Černá = rekonstrukce ústavu, barevně = dvě sítě na zašuměných měřeních",
      lens: "Lupa: kde se síť liší", axisTile: "Chyba polohy osy", th: "Předpověď", limWarn: "Limiterový snímek: okraj je méně jistý, vnitřní strana se může lišit o 25 až 30 mm." };
$("#predChip").textContent = TXT.chip;
const MINUS = "−";
function fmt(v, d) {
  if (v == null || Number.isNaN(v)) return "–";
  let s = v.toFixed(d); if (/^-0(\.0*)?$/.test(s)) s = s.slice(1);
  return s.replace(".", ",").replace("-", MINUS);
}
const fmtSigned = (v, d) => { if (v == null) return "–"; const s = fmt(v, d); return s[0] === MINUS || /^0[,0]*$/.test(s) ? s : "+" + s; };
const LAT = D.latency || { medianMs: 0.0145, cpu: "", source: "results/ipp1-latency.md" }; // the shipped pair (results/ipp1-latency-shipped.md) or the baseline network
const show = { true: true, pred: true, pts: true, grid: true };
const state = { di: 0, i: 0, pos: 0, playing: false, speed: 1, param: "axis", hover: null, noise: false };
const TEAL = "#0b8f7c";
// Prediction sets drawn right now: [column suffix, colour, label]. The noise mode compares a plain and a hardened network on noisy inputs.
const sets = () => (state.noise ? [["_clean_on_noisy", COL.pred, TXT.a], ["_hardened_on_noisy", TEAL, TXT.b]] : [["_pred", COL.pred, TXT.pred]]);
const sfxOf = (pred) => (pred === true ? "_pred" : pred || "");

// Rows of the table: group, label, column, factor, unit, decimals.
const ROWS = [
  ["Proud a tvar", "Proud Ip", "plasma_current", 1e-3, "kA", 2], ["Proud a tvar", "Elongace κ", "elongation", 1, "", 4],
  ["Proud a tvar", "Triangularita δ", "triangularity", 1, "", 4], ["Proud a tvar", "δ horní", "triangularity_upper", 1, "", 4],
  ["Proud a tvar", "δ dolní", "triangularity_lower", 1, "", 4],
  ["Magnetická osa", "R", "R_mag_axis", 1e3, "mm", 1], ["Magnetická osa", "Z", "Z_mag_axis", 1e3, "mm", 1],
  ["X-bod", "R", "R_x_point", 1e3, "mm", 1], ["X-bod", "Z", "Z_x_point", 1e3, "mm", 1],
  ["Strike point 1 (menší R)", "R", "sp:0:R", 1e3, "mm", 1], ["Strike point 1 (menší R)", "Z", "sp:0:Z", 1e3, "mm", 1],
  ["Strike point 2 (větší R)", "R", "sp:1:R", 1e3, "mm", 1], ["Strike point 2 (větší R)", "Z", "sp:1:Z", 1e3, "mm", 1],
  ["Limiter", "R", "R_limiter", 1e3, "mm", 1], ["Limiter", "Z", "Z_limiter", 1e3, "mm", 1],
];

  out.push(`<tr class="grp"><td colspan="5">Konfigurace</td></tr><tr><td>Typ plazmatu</td><td class="u"></td><td class="n t">${lt ? "limiterové" : "divertorové"}</td><td class="n p">${lp ? "limiterové" : "divertorové"}</td><td class="n d">${lt === lp ? "shoda" : "rozdíl"}</td></tr>`);
  let group = "";
  for (const [g, label, name, k, unit, dec] of ROWS) {
    if (!ROWS.some((r) => r[0] === g && (value(c, i, r[2], "") != null || value(c, i, r[2], "_pred") != null))) continue;
    if (g !== group) { out.push(`<tr class="grp"><td colspan="5">${g}${unitOf(g)}</td></tr>`); group = g; }
    const t = value(c, i, name, false), p = value(c, i, name, true), has = t != null && p != null;
    out.push(`<tr><td>${label}</td><td class="u">${unit}</td><td class="n t">${t == null ? "–" : fmt(t * k, dec)}</td><td class="n p">${has ? fmt(p * k, dec) : "–"}</td><td class="n d">${has ? fmtSigned((p - t) * k, dec) : "–"}</td></tr>`);
  }
  $("#rows").innerHTML = out.join("");
  const e = d.c.R_mag_axis.map((_, n) => axisErr(d.c, n)), mean = e.reduce((a, b) => a + b, 0) / e.length, rms = Math.sqrt(e.reduce((a, b) => a + b * b, 0) / e.length);
  $("#sum").innerHTML = `<div><span>Chyba polohy magnetické osy, tento snímek:</span> <b>${fmt(axisErr(c, i), 2)} mm</b></div>` +
    `<div><span>Ve výboji ${d.id}:</span> průměr <b>${fmt(mean, 2)}</b>, RMS <b>${fmt(rms, 2)}</b>, největší <b>${fmt(Math.max(...e), 1)} mm</b></div>` +
    `<div><span>Začátek a konec výboje jsou méně spolehlivé: plazma tam vzniká nebo zaniká.</span></div>`;
}

// ---- error chart -------------------------------------------------------------------------------
const FLAT = ROWS.filter((r) => !r[2].startsWith("sp:"));
const PARAMS = [["axis", "Poloha magnetické osy (mm)"], ...FLAT.map((r) => [r[2], `${r[0] === r[1] ? r[0] : r[0] + ", " + r[1]}${r[4] ? " (" + r[4] + ")" : ""}`])];
function series(param, sfx = "_pred") {
  const c = cur().c, n = cur().n, out = [];
  for (let i = 0; i < n; i++) {
    if (param === "axis") { out.push(axisErr(c, i, sfx)); continue; }
    const row = ROWS.find((r) => r[2] === param), t = c[param][i], p = c[param + sfx][i];
    out.push(t == null || p == null ? null : (p - t) * row[3]);
  }
  return out;
}
const chart = $("#chart"), cctx = chart.getContext("2d");
let cgeom = null;
function drawChart() {
  const f = fitCanvas(chart), ctx = cctx, ss = sets().map(([sfx, col, label]) => ({ s: series(state.param, sfx), col, label })), n = cur().n;
  const valid = ss.flatMap((q) => q.s.filter((v) => v != null)), signed = state.param !== "axis";
  const c = cur().c, L = 56, R = 14, T = 10, B = 30, W = f.w - L - R, H = f.h - T - B;
  cgeom = { L, W, n, ss };
  ctx.setTransform(f.dpr, 0, 0, f.dpr, 0, 0); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, f.w, f.h);
  if (!valid.length) { ctx.fillStyle = COL.muted; ctx.font = FONT; ctx.fillText("Pro tento výboj tento parametr neexistuje (platí jen pro jednu z konfigurací).", L, T + 24); $("#chartStats").textContent = ""; return; }
  const sorted = [...valid].map(Math.abs).sort((a, b) => a - b), cap = (sorted[Math.floor(0.97 * (sorted.length - 1))] || 1) * 1.35;
  const lo = signed ? -cap : 0, hi = cap, px = (i) => L + (i / Math.max(1, n - 1)) * W, py = (v) => T + H - ((clamp(v, lo, hi) - lo) / (hi - lo)) * H;
  // background bands: the limiter configuration is shaded, each phase is named when it is wide enough
  const segs = []; let s0 = 0;
  for (let i = 1; i <= n; i++) if (i === n || (c.is_limited[i] > 0.5) !== (c.is_limited[s0] > 0.5)) { segs.push([s0, i - 1, c.is_limited[s0] > 0.5]); s0 = i; }
  for (const [a, b, lim] of segs) {
    if (lim) { ctx.fillStyle = COL.band; ctx.fillRect(px(a), T, px(b) - px(a) + 1, H); }
    if (px(b) - px(a) > 80) { ctx.fillStyle = "#94a3b8"; ctx.font = "11px -apple-system, 'SF Pro Text', 'Segoe UI', Arial, sans-serif"; ctx.textAlign = "center"; ctx.fillText(lim ? "limiterová" : "divertorová", (px(a) + px(b)) / 2, T + 13); }
  }
  const ty = niceTicks(lo, hi, 4), tx = niceTicks(0, 1, 5);
  ctx.strokeStyle = COL.grid; ctx.lineWidth = 1; ctx.beginPath();
  for (const v of ty.major) { ctx.moveTo(L, Math.round(py(v)) + 0.5); ctx.lineTo(L + W, Math.round(py(v)) + 0.5); }
  for (const v of tx.major) { const x = Math.round(L + v * W) + 0.5; ctx.moveTo(x, T); ctx.lineTo(x, T + H); }
  ctx.stroke();
  if (signed) { ctx.strokeStyle = "#94a3b8"; ctx.beginPath(); ctx.moveTo(L, py(0) + 0.5); ctx.lineTo(L + W, py(0) + 0.5); ctx.stroke(); }
  for (const q of ss) {
    ctx.beginPath(); let open = false;
    q.s.forEach((v, i) => { if (v == null) { open = false; return; } open ? ctx.lineTo(px(i), py(v)) : ctx.moveTo(px(i), py(v)); open = true; });
    ctx.lineWidth = 1.6; ctx.strokeStyle = q.col; ctx.stroke();
  }
  ctx.strokeStyle = "#334155"; ctx.lineWidth = 1; ctx.strokeRect(L + 0.5, T + 0.5, W, H);
  ctx.font = FONT; ctx.fillStyle = "#334155"; ctx.textAlign = "right";
  ctx.beginPath(); for (const v of ty.major) { const y = Math.round(py(v)) + 0.5; ctx.moveTo(L, y); ctx.lineTo(L + 5, y); ctx.fillText(fmt(v, ty.step < 1 ? 2 : ty.step < 10 ? 1 : 0), L - 7, y + 4); } ctx.stroke();
  ctx.textAlign = "center"; ctx.beginPath(); for (const v of tx.major) { const x = Math.round(L + v * W) + 0.5; ctx.moveTo(x, T + H); ctx.lineTo(x, T + H - 5); ctx.fillText(fmt(v, 1), x, T + H + 15); } ctx.stroke();
  ctx.fillText("relativní čas ve výboji", L + W / 2, f.h - 3);
  const x = Math.round(px(state.i)) + 0.5; ctx.strokeStyle = "#101d42"; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(x, T); ctx.lineTo(x, T + H); ctx.stroke();
  const stat = (q) => { const a = q.s.filter((v) => v != null).map(Math.abs); return a.length ? `${fmt(avg(a), 2)}` : "–"; };
  $("#chartStats").textContent = state.noise ? `${signed ? "Δ = předpověď − rekonstrukce · " : ""}průměr |Δ|: ${TXT.an} ${stat(ss[0])} · ${TXT.bn} ${stat(ss[1])}`
    : `${signed ? "Δ = předpověď − rekonstrukce · " : ""}průměr |Δ| ${stat(ss[0])} · největší |Δ| ${fmt(Math.max(...valid.map(Math.abs)), 1)}`;
}
function chartSeek(ev) {
  if (!cgeom) return; const r = chart.getBoundingClientRect();
  state.i = clamp(Math.round(((ev.clientX - r.left - cgeom.L) / cgeom.W) * (cgeom.n - 1)), 0, cgeom.n - 1); render();
}
chart.addEventListener("mousemove", (ev) => {
  if (!cgeom || !cgeom.ss) return; const r = chart.getBoundingClientRect();
  const i = clamp(Math.round(((ev.clientX - r.left - cgeom.L) / cgeom.W) * (cgeom.n - 1)), 0, cgeom.n - 1);
  $("#sbCursor").textContent = `Graf: t = ${fmt(cur().c.time[i], 3)}   ` + cgeom.ss.map((q) => `${q.s[i] == null ? "–" : fmt(q.s[i], 2)}`).join(" / ");
});
chart.addEventListener("mouseleave", () => ($("#sbCursor").textContent = "R = –   Z = –"));
let dragging = false;
chart.addEventListener("mousedown", (e) => { dragging = true; chartSeek(e); });
window.addEventListener("mousemove", (e) => { if (dragging) chartSeek(e); });
window.addEventListener("mouseup", () => (dragging = false));

// ---- controls ----------------------------------------------------------------------------------
function status() {
  const d = cur(), c = d.c, i = state.i;
  $("#sbFrame").textContent = `Výboj ${d.id} | ` + (SHIPPED ? (d.locked ? "odložený výboj, nebyl v učení" : `vývojový výboj, křížová validace ${d.fold + 1} z 5`) : `validační skupina ${d.fold + 1} z 5`) + ` | snímek ${i + 1} / ${d.n}`;
  $("#sbModel").textContent = state.noise ? "Vstupy: zašuměná měření organizátorů (bílý šum), výboj nebyl v učení" : (SHIPPED ? "Předpověď: vybraný model, výboj nebyl v učení" : "Předpověď: neuronová síť, výboj nebyl v učení");
  $("#sbWall").textContent = D.wall ? "Obrys stěny: načten" : "Obrys stěny: nenačten";
  $("#cfgTag").textContent = `${isLimited(c, i, false) ? "limiterová" : "divertorová"} konfigurace · t = ${fmt(c.time[i], 3)}`;
  $("#tbox").value = `t = ${fmt(c.time[i], 3)}`;
}
function render() { if (!state.playing) state.pos = state.i; drawLegendBar(); drawStage(); drawRail(); drawTable(); drawChart(); status(); $("#slider").value = state.i; $("#slider").style.setProperty("--p", (cur().n > 1 ? (100 * state.i) / (cur().n - 1) : 0) + "%"); }
function selectDischarge(idx) { state.di = idx; state.i = 0; $("#slider").max = cur().n - 1; $("#discharge").value = idx; render(); }
function init() {
  const opt = (d, k) => `<option value="${k}">Výboj ${d.id} · osa ${fmt(d.axisErrMm, d.axisErrMm < 1 ? 2 : 1)} mm · ${Math.round(d.limitedShare * 100)} % lim.</option>`;
  const nLocked = D.discharges.filter((d) => d.locked).length;
  // The shipped model: the discharges that were set aside come first (they are sorted first in data.js), then the development discharges (out of fold).
  $("#discharge").innerHTML = SHIPPED
    ? `<optgroup label="${nLocked} odložených výbojů (model je při učení neviděl)">${D.discharges.map((d, k) => (d.locked ? opt(d, k) : "")).join("")}</optgroup>` +
      `<optgroup label="${D.discharges.length - nLocked} vývojových výbojů (předpověď z křížové validace)">${D.discharges.map((d, k) => (d.locked ? "" : opt(d, k))).join("")}</optgroup>`
    : D.discharges.map(opt).join("");
  $("#param").innerHTML = PARAMS.map(([v, l]) => `<option value="${v}">${l}</option>`).join("");
  const q = new URLSearchParams(location.hash.slice(1));
  const byId = q.has("d") ? D.discharges.findIndex((d) => d.id === +q.get("d")) : -1;
  // Open on a typical divertor discharge, in the middle of its longest divertor stretch (not on the start or end frames).
  const div = D.discharges.filter((d) => d.limitedShare < 0.6 && (!SHIPPED || d.locked)), med = [...div].sort((a, b) => a.axisErrMm - b.axisErrMm)[Math.floor(div.length / 2)];
  const midFrame = (d) => { let best = [0, 0], s0 = null; for (let k = 0; k <= d.n; k++) { const dv = k < d.n && d.c.is_limited[k] < 0.5; if (dv && s0 == null) s0 = k; if (!dv && s0 != null) { if (k - s0 > best[1] - best[0]) best = [s0, k]; s0 = null; } } return Math.floor((best[0] + best[1]) / 2); };
  layoutStage(); selectDischarge(byId >= 0 ? byId : D.discharges.indexOf(med));
  if (byId < 0 && !q.get("f")) { state.i = midFrame(cur()); render(); }
  if (q.get("f")) { state.i = clamp(Math.round(+q.get("f") * (cur().n - 1)), 0, cur().n - 1); render(); }
  if (q.get("noise") === "1" && D.hasNoise) { state.noise = true; $("#showNoise").checked = true; render(); }
  if (q.get("play") === "1") play(true);
}
let timer = null;
const ICON_PLAY = '<svg viewBox="0 0 14 14"><polygon points="3,1.5 12,7 3,12.5"/></svg>', ICON_PAUSE = '<svg viewBox="0 0 14 14"><rect x="2.5" y="2" width="3" height="10"/><rect x="8.5" y="2" width="3" height="10"/></svg>';
function play(on) {
  state.playing = on; $("#play").innerHTML = on ? ICON_PAUSE : ICON_PLAY; $("#play").classList.toggle("on", on); clearInterval(timer);
  if (on) { state.pos = state.i; timer = setInterval(() => { state.pos = (state.pos + (cur().n / 300) * state.speed) % cur().n; state.i = Math.floor(state.pos); render(); }, 33); }
}
const step = (k) => { state.i = clamp(state.i + k, 0, cur().n - 1); render(); };
$("#play").onclick = () => play(!state.playing);
$("#first").onclick = () => { state.i = 0; render(); }; $("#last").onclick = () => { state.i = cur().n - 1; render(); };
$("#prev").onclick = () => step(-1); $("#next").onclick = () => step(1);
$("#slider").oninput = (e) => { state.i = +e.target.value; render(); };
$("#discharge").onchange = (e) => selectDischarge(+e.target.value);
$("#speed").onchange = (e) => (state.speed = +e.target.value);
$("#param").onchange = (e) => { state.param = e.target.value; drawChart(); };
if (!D.hasNoise) $("#chipNoise").style.display = "none";
$("#showNoise").onchange = (e) => { state.noise = e.target.checked; render(); };
show.lens = true;
for (const [id, key] of [["showTrue", "true"], ["showPred", "pred"], ["showPts", "pts"], ["showGrid", "grid"], ["showLens", "lens"]]) $("#" + id).onchange = (e) => { show[key] = e.target.checked; drawStage(); };
$("#export").onclick = () => stage.toBlob((b) => { const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = `vyboj${cur().id}_t${cur().c.time[state.i].toFixed(3)}.png`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); });
stage.addEventListener("mousemove", (e) => {
  const r = stage.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  if (x < view.x0 || x > view.x0 + view.pw || y < view.y0 || y > view.y0 + view.ph) { stage.dispatchEvent(new Event("mouseleave")); return; }
  state.hover = { x, y }; const R = view.R0 + (x - view.x0) / view.sc, Z = view.Z1 - (y - view.y0) / view.sc;
  $("#sbCursor").textContent = `R = ${fmt(R, 3)} m   Z = ${fmt(Z, 3)} m`; drawStage();
});
stage.addEventListener("mouseleave", () => { state.hover = null; $("#sbCursor").textContent = "R = –   Z = –"; drawStage(); });
window.addEventListener("keydown", (e) => {
  if (e.target.tagName === "SELECT" || e.target.tagName === "INPUT" && e.target.type === "text") return;
  if (e.code === "Space") { e.preventDefault(); play(!state.playing); }
  if (e.code === "ArrowRight") step(1); if (e.code === "ArrowLeft") step(-1);
  if (e.code === "Home") { state.i = 0; render(); } if (e.code === "End") { state.i = cur().n - 1; render(); }
});
new ResizeObserver(() => { layoutStage(); render(); }).observe(document.querySelector("main"));
init();
</script>
