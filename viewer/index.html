<!doctype html>
<html lang="cs">
<head>

<style>
:root {
  --chrome: #e4e8ed; --chrome2: #d3d9e0; --panel: #ffffff; --border: #a7b1bd; --text: #17202a; --muted: #5a6877;
  --true: #12161c; --pred: #d9452a; --sel: #2a6fb5; --grid: #e4e8ed; --band: #eef1f5; --title: #1d2a38;
  --ui: "Segoe UI", "Helvetica Neue", Arial, sans-serif; --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: 28px 42px minmax(0, 1fr) 24px; background: var(--chrome); color: var(--text);
  font: 12.5px/1.35 var(--ui); user-select: none; }
.titlebar { background: var(--title); color: #e8edf3; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; font-size: 12.5px; }
.titlebar b { font-weight: 600; letter-spacing: 0.01em; } .titlebar span { color: #9fb0c2; }
.toolbar { overflow: hidden; display: flex; align-items: center; gap: 12px; padding: 0 10px; border-bottom: 1px solid var(--border); background: var(--chrome2); }
.group { display: flex; align-items: center; gap: 6px; padding-right: 12px; border-right: 1px solid var(--border); height: 26px; }
.group:last-child { border-right: 0; margin-left: auto; padding-right: 0; }
label.k { color: var(--muted); }
select, button, input[type=text] { height: 24px; border: 1px solid var(--border); background: #f7f9fb; color: var(--text); font: inherit;
  border-radius: 2px; padding: 0 7px; }
button { cursor: pointer; min-width: 26px; display: inline-flex; align-items: center; justify-content: center; }
button:hover, select:hover { background: #fff; border-color: #7f8c9b; }
button:active, button.on { background: #cfd8e3; }
button svg { width: 14px; height: 14px; fill: #25303c; }
input[type=range] { width: 210px; accent-color: var(--sel); height: 18px; }
.tbox { font-family: var(--mono); width: 88px; text-align: right; background: #fff; cursor: default; }
label.chk { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; } label.chk i { width: 16px; height: 0; border-top: 2px solid; }
input[type=checkbox] { margin: 0; accent-color: var(--sel); }
main { display: grid; grid-template-columns: minmax(0, 1fr) 452px; gap: 6px; padding: 6px; min-height: 0; }
.left { display: grid; grid-template-rows: minmax(0, 1fr) 218px; gap: 6px; min-height: 0; min-width: 0; }
.panel { background: var(--panel); border: 1px solid var(--border); display: grid; grid-template-rows: 24px minmax(0, 1fr); min-height: 0; min-width: 0; }
.ph { background: var(--chrome2); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; padding: 0 8px; font-weight: 600; }
.ph { white-space: nowrap; } .ph .sp { overflow: hidden; text-overflow: ellipsis; min-width: 0; margin-left: auto; font-weight: 400; color: var(--muted); font-family: var(--mono); font-size: 11.5px; }
.ph select { height: 20px; font-weight: 400; max-width: 250px; }
.pb { position: relative; min-height: 0; min-width: 0; }
.pb canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.tablepanel { grid-template-rows: 24px minmax(0, 1fr) auto; }
.scroll { overflow: auto; }

thead th { position: sticky; top: 0; background: #f1f4f7; border-bottom: 1px solid var(--border); text-align: right; font-weight: 600; padding: 4px 8px; color: var(--muted); }
th:first-child, td:first-child { text-align: left; }

td.n { font-family: var(--mono); font-size: 12px; } td.t { color: var(--true); } td.p { color: var(--pred); } td.d { color: var(--muted); } td.u { color: var(--muted); text-align: left; }
tr.grp td { background: #f1f4f7; color: var(--muted); font-weight: 600; text-transform: none; padding: 3px 8px; border-bottom: 1px solid #dde3e9; text-align: left; }
.sum { border-top: 1px solid var(--border); background: #f7f9fb; padding: 6px 9px; font-size: 12px; color: var(--text); display: grid; gap: 2px; }
.sum span { color: var(--muted); } .sum b { font-family: var(--mono); font-weight: 600; }
.status { display: flex; align-items: center; gap: 0; background: var(--chrome2); border-top: 1px solid var(--border); font: 11.5px var(--mono); color: #2a3441; }
.status div { padding: 0 12px; height: 100%; display: flex; align-items: center; border-right: 1px solid var(--border); white-space: nowrap; }
.status div:last-child { margin-left: auto; border-right: 0; border-left: 1px solid var(--border); }
.fatal { padding: 40px; font-size: 18px; }
@media (max-width: 1300px) { main { grid-template-columns: minmax(0, 1fr) 410px; } input[type=range] { width: 84px; } .tbox { width: 76px; } .group { padding-right: 8px; } .toolbar { gap: 8px; } #discharge { width: 214px !important; } label.k[for=speed] { display: none; } }
@media (max-height: 800px) { .left { grid-template-rows: minmax(0, 1fr) 170px; } td { padding: 1.5px 8px; } }
</style>

<body>
<div class="titlebar"><b>COMPASS: rekonstrukce tvaru a polohy plazmatu z magnetických měření</b><span>IPP úloha 1 · ČVUT ML Hackathon 2026</span></div>
<div class="toolbar">
  <div class="group"><label class="k" for="discharge">Výboj</label><select id="discharge" style="width:330px"></select></div>
  <div class="group">
    <button id="first" title="Na začátek (Home)"><svg viewBox="0 0 14 14"><rect x="1" y="2" width="2" height="10"/><polygon points="12,2 4,7 12,12"/></svg></button>
    <button id="prev" title="Snímek zpět (←)"><svg viewBox="0 0 14 14"><polygon points="11,2 3,7 11,12"/></svg></button>
    <button id="play" title="Přehrát nebo pozastavit (mezerník)"><svg viewBox="0 0 14 14"><polygon points="3,1.5 12,7 3,12.5"/></svg></button>
    <button id="next" title="Snímek vpřed (→)"><svg viewBox="0 0 14 14"><polygon points="3,2 11,7 3,12"/></svg></button>
    <button id="last" title="Na konec (End)"><svg viewBox="0 0 14 14"><polygon points="2,2 10,7 2,12"/><rect x="11" y="2" width="2" height="10"/></svg></button>
    <input id="slider" type="range" min="0" max="0" value="0" aria-label="Čas ve výboji">

  <div class="group"><label class="k" for="speed">Rychlost</label><select id="speed"><option value="1">1×</option><option value="2" selected>2×</option><option value="4">4×</option><option value="8">8×</option></select></div>
  <div class="group">
    <label class="chk"><input type="checkbox" id="showTrue" checked><i style="border-color:var(--true)"></i>Skutečnost</label>
    <label class="chk"><input type="checkbox" id="showPred" checked><i style="border-color:var(--pred);border-top-style:dashed"></i>Předpověď</label>
    <label class="chk"><input type="checkbox" id="showPts" checked>Body</label>
    <label class="chk"><input type="checkbox" id="showGrid" checked>Mřížka</label>
  </div>
  <div class="group"><button id="export" style="padding:0 10px">Uložit PNG</button></div>
</div>
<main>
  <div class="left">
    <section class="panel"><div class="ph">Poloidální průřez, rovina R–Z<span class="sp" id="cfgTag"></span></div><div class="pb"><canvas id="stage"></canvas></div></section>
    <section class="panel"><div class="ph">Chyba předpovědi v čase <select id="param" aria-label="Parametr"></select><span class="sp" id="chartStats"></span></div><div class="pb"><canvas id="chart"></canvas></div></section>
  </div>
  <section class="panel tablepanel">
    <div class="ph">Parametry v tomto snímku</div>
    <div class="scroll"><table><thead><tr><th>Parametr</th><th style="text-align:left">Jedn.</th><th>Skutečnost</th><th>Předpověď</th><th>Δ</th></tr></thead><tbody id="rows"></tbody></table></div>
    <div class="sum" id="sum"></div>
  </section>
</main>
<div class="status"><div id="sbFrame"></div><div id="sbCursor">R = –   Z = –</div><div id="sbModel"></div><div id="sbWall"></div></div>
<script src="data.js"></script>
<script>
"use strict";
const D = window.VIEWER;
if (!D) { document.body.style.display = "block"; document.body.innerHTML = '<p class="fatal">Chybí soubor data.js. Vytvoří se příkazem analysis/export_viewer_data.py.</p>'; throw new Error("data.js missing"); }
const $ = (s) => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const COL = { true: css("--true"), pred: css("--pred"), grid: css("--grid"), muted: css("--muted"), band: css("--band"), border: css("--border") };
const MINUS = "−";
function fmt(v, d) {
  if (v == null || Number.isNaN(v)) return "–";
  let s = v.toFixed(d); if (/^-0(\.0*)?$/.test(s)) s = s.slice(1);
  return s.replace(".", ",").replace("-", MINUS);
}
const fmtSigned = (v, d) => (v == null ? "–" : (v >= 0 && fmt(v, d)[0] !== MINUS ? "+" : "") + fmt(v, d));
const show = { true: true, pred: true, pts: true, grid: true };
const state = { di: 0, i: 0, playing: false, speed: 2, param: "axis", hover: null };

// Rows of the table: group, label, column, factor, unit, decimals.
const ROWS = [
  ["Proud a tvar", "Proud Ip", "plasma_current", 1e-3, "kA", 2], ["Proud a tvar", "Elongace κ", "elongation", 1, "", 4],
  ["Proud a tvar", "Triangularita δ", "triangularity", 1, "", 4], ["Proud a tvar", "δ horní", "triangularity_upper", 1, "", 4],
  ["Proud a tvar", "δ dolní", "triangularity_lower", 1, "", 4],
  ["Magnetická osa", "R", "R_mag_axis", 1e3, "mm", 1], ["Magnetická osa", "Z", "Z_mag_axis", 1e3, "mm", 1],
  ["X-bod", "R", "R_x_point", 1e3, "mm", 1], ["X-bod", "Z", "Z_x_point", 1e3, "mm", 1],
  ["Strike point 1 (menší R)", "R", "sp:0:R", 1e3, "mm", 1], ["Strike point 1 (menší R)", "Z", "sp:0:Z", 1e3, "mm", 1],
  ["Strike point 2 (větší R)", "R", "sp:1:R", 1e3, "mm", 1], ["Strike point 2 (větší R)", "Z", "sp:1:Z", 1e3, "mm", 1],
  ["Limiter", "R", "R_limiter", 1e3, "mm", 1], ["Limiter", "Z", "Z_limiter", 1e3, "mm", 1],
];
// Strike points can swap places between rows, so both sets are paired by increasing R.
function strikes(c, i, suffix) {
  const a = [c["R_strike_point_1" + suffix]?.[i], c["Z_strike_point_1" + suffix]?.[i]];
  const b = [c["R_strike_point_2" + suffix]?.[i], c["Z_strike_point_2" + suffix]?.[i]];
  if (a[0] == null || b[0] == null) return [null, null];
  return a[0] <= b[0] ? [a, b] : [b, a];
}
function value(c, i, name, pred) {
  const m = name.match(/^sp:(\d):([RZ])$/);
  if (m) { const s = strikes(c, i, pred ? "_pred" : "")[+m[1]]; return s ? s[m[2] === "R" ? 0 : 1] : null; }
  const v = c[name + (pred ? "_pred" : "")]?.[i];
  return v == null ? null : v;
}
const cur = () => D.discharges[state.di];
const isLimited = (c, i, pred) => (pred ? (c.is_limited_pred[i] ?? 0) > 0.5 : c.is_limited[i] > 0.5);

// Boundary of the plasma as four superellipses (Luce 2013), as in the organisers' notebook.
function boundary(get, n = 60) {
  const quadrants = [["upper_outer", "outer", "top", false], ["upper_inner", "inner", "top", true],
    ["lower_inner", "inner", "bottom", false], ["lower_outer", "outer", "bottom", true]];
  const R = [], Z = [];
  for (const [q, side, tip, reverse] of quadrants) {
    const diagonal = 1 / Math.SQRT2 + get("squareness_" + q) * (1 - 1 / Math.SQRT2);
    const p = -Math.log(2) / Math.log(clamp(diagonal, 0.01, 0.99));
    const Rs = get("R_" + side), Zs = get("Z_" + side), Rt = get("R_" + tip), Zt = get("Z_" + tip);
    const qr = [], qz = [];
    for (let k = 0; k < n; k++) {
      const phi = (k / (n - 1)) * Math.PI / 2;
      qr.push(Rt + (Rs - Rt) * Math.pow(Math.cos(phi), 2 / p));
      qz.push(Zs + (Zt - Zs) * Math.pow(Math.sin(phi), 2 / p));
    }
    if (reverse) { qr.reverse(); qz.reverse(); }
    R.push(...qr); Z.push(...qz);
  }
  return [R, Z];
}
const BOUNDARY_NAMES = ["R_top", "Z_top", "R_bottom", "Z_bottom", "R_outer", "Z_outer", "R_inner", "Z_inner",
  "squareness_upper_outer", "squareness_upper_inner", "squareness_lower_outer", "squareness_lower_inner"];
const HAS_PRED_BOUNDARY = BOUNDARY_NAMES.every((n) => D.predColumns.includes(n + "_pred"));

// ---- axes helpers ------------------------------------------------------------------------------
function niceTicks(lo, hi, target) {
  const raw = (hi - lo) / target, mag = Math.pow(10, Math.floor(Math.log10(raw))), norm = raw / mag;
  const lead = norm < 1.5 ? 1 : norm < 3 ? 2 : norm < 7 ? 5 : 10, step = lead * mag;
  const major = [], minor = [], sub = lead === 2 ? 4 : 5;
  for (let v = Math.ceil(lo / step - 1e-9) * step; v <= hi + 1e-9; v += step) major.push(+v.toFixed(10));
  for (let v = Math.ceil(lo / (step / sub) - 1e-9) * (step / sub); v <= hi + 1e-9; v += step / sub) minor.push(+v.toFixed(10));
  return { major, minor, step };
}
function fitCanvas(cv) {
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  cv.width = Math.max(1, Math.round(r.width * dpr)); cv.height = Math.max(1, Math.round(r.height * dpr));
  return { w: r.width, h: r.height, dpr };
}
const FONT = "11.5px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif";

// ---- stage -------------------------------------------------------------------------------------
const stage = $("#stage"), sctx = stage.getContext("2d");
let view = null;
function layoutStage() {
  const f = fitCanvas(stage), [R0, R1] = D.view.R, [Z0, Z1] = D.view.Z, pl = 64, pr = 22, pt = 16, pb = 50;
  const sc = Math.min((f.w - pl - pr) / (R1 - R0), (f.h - pt - pb) / (Z1 - Z0));
  const pw = sc * (R1 - R0), ph = sc * (Z1 - Z0);
  view = { sc, pw, ph, x0: pl + (f.w - pl - pr - pw) / 2, y0: pt + (f.h - pt - pb - ph) / 2, w: f.w, h: f.h, dpr: f.dpr, R0, R1, Z0, Z1 };
}
const X = (R) => view.x0 + (R - view.R0) * view.sc, Y = (Z) => view.y0 + (view.Z1 - Z) * view.sc;
function path(ctx, R, Z, close) {
  ctx.beginPath(); R.forEach((r, k) => (k ? ctx.lineTo(X(r), Y(Z[k])) : ctx.moveTo(X(r), Y(Z[k])))); if (close) ctx.closePath();
}
function marker(ctx, kind, x, y, color, filled, s = 6) {
  ctx.lineWidth = 1.7; ctx.strokeStyle = color; ctx.fillStyle = color; ctx.beginPath();
  if (kind === "circle") ctx.arc(x, y, s, 0, 2 * Math.PI);
  else if (kind === "square") ctx.rect(x - s, y - s, 2 * s, 2 * s);
  else if (kind === "tri") { ctx.moveTo(x - s, y - s); ctx.lineTo(x + s, y - s); ctx.lineTo(x, y + s); ctx.closePath(); }
  else { ctx.moveTo(x - s, y - s); ctx.lineTo(x + s, y + s); ctx.moveTo(x + s, y - s); ctx.lineTo(x - s, y + s); }
  if (kind !== "x" && filled) ctx.fill(); else ctx.stroke();
}
function drawFrame(ctx) {
  const v = view, tx = niceTicks(v.R0, v.R1, v.pw / 70), tz = niceTicks(v.Z0, v.Z1, v.ph / 60);
  if (show.grid) {
    ctx.lineWidth = 1; ctx.strokeStyle = COL.grid; ctx.beginPath();
    for (const r of tx.major) { ctx.moveTo(Math.round(X(r)) + 0.5, v.y0); ctx.lineTo(Math.round(X(r)) + 0.5, v.y0 + v.ph); }
    for (const z of tz.major) { ctx.moveTo(v.x0, Math.round(Y(z)) + 0.5); ctx.lineTo(v.x0 + v.pw, Math.round(Y(z)) + 0.5); }
    ctx.stroke();
  }
  return { tx, tz };
}
function drawAxes(ctx, t) {
  const v = view;
  ctx.strokeStyle = "#222b36"; ctx.lineWidth = 1; ctx.strokeRect(v.x0 + 0.5, v.y0 + 0.5, v.pw, v.ph);
  ctx.beginPath();
  for (const [ticks, len] of [[t.tx.major, 6], [t.tx.minor, 3]]) for (const r of ticks) {
    const x = Math.round(X(r)) + 0.5; ctx.moveTo(x, v.y0 + v.ph); ctx.lineTo(x, v.y0 + v.ph - len); ctx.moveTo(x, v.y0); ctx.lineTo(x, v.y0 + len); }
  for (const [ticks, len] of [[t.tz.major, 6], [t.tz.minor, 3]]) for (const z of ticks) {
    const y = Math.round(Y(z)) + 0.5; ctx.moveTo(v.x0, y); ctx.lineTo(v.x0 + len, y); ctx.moveTo(v.x0 + v.pw, y); ctx.lineTo(v.x0 + v.pw - len, y); }
  ctx.stroke();
  ctx.font = FONT; ctx.fillStyle = "#222b36";
  ctx.textAlign = "center"; for (const r of t.tx.major) ctx.fillText(fmt(r, t.tx.step < 0.1 ? 2 : 1), X(r), v.y0 + v.ph + 17);
  ctx.textAlign = "right"; for (const z of t.tz.major) ctx.fillText(fmt(z, t.tz.step < 0.1 ? 2 : 1), v.x0 - 8, Y(z) + 4);
  ctx.textAlign = "center"; ctx.fillText("R (m)", v.x0 + v.pw / 2, v.y0 + v.ph + 36);
  ctx.save(); ctx.translate(v.x0 - 46, v.y0 + v.ph / 2); ctx.rotate(-Math.PI / 2); ctx.fillText("Z (m)", 0, 0); ctx.restore();
}
function drawLegend(ctx) {
  const v = view, rows = [["line", "Skutečnost (reference)"], ["dash", "Předpověď sítě"], ["circle", "Magnetická osa"], ["x", "X-bod"], ["tri", "Strike point"], ["square", "Bod dotyku s limiterem"]];
  const w = 168, h = rows.length * 17 + 10, outside = v.w - (v.x0 + v.pw) - 12 >= w + 8;
  const x = outside ? v.x0 + v.pw + 14 : v.x0 + v.pw - w - 10, y = v.y0 + (outside ? 0 : 10);
  ctx.fillStyle = "rgba(255,255,255,0.94)"; ctx.fillRect(x, y, w, h); ctx.strokeStyle = COL.border; ctx.lineWidth = 1; ctx.strokeRect(x + 0.5, y + 0.5, w, h);
  ctx.font = FONT; ctx.textAlign = "left"; ctx.fillStyle = "#222b36";
  rows.forEach(([k, label], n) => {
    const cy = y + 14 + n * 17;
    if (k === "line" || k === "dash") { ctx.strokeStyle = k === "line" ? COL.true : COL.pred; ctx.lineWidth = 2; ctx.setLineDash(k === "dash" ? [6, 4] : []); ctx.beginPath(); ctx.moveTo(x + 8, cy); ctx.lineTo(x + 32, cy); ctx.stroke(); ctx.setLineDash([]); }
    else marker(ctx, k, x + 20, cy, "#59656f", false, 4.5);
    ctx.fillStyle = "#222b36"; ctx.fillText(label, x + 40, cy + 4);
  });
}
function drawStage() {
  const c = cur().c, i = state.i, ctx = sctx, v = view;
  ctx.setTransform(v.dpr, 0, 0, v.dpr, 0, 0); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, v.w, v.h);
  const ticks = drawFrame(ctx);
  ctx.save(); ctx.beginPath(); ctx.rect(v.x0, v.y0, v.pw, v.ph); ctx.clip();
  if (D.wall) {
    ctx.beginPath(); ctx.rect(v.x0 - 5, v.y0 - 5, v.pw + 10, v.ph + 10);
    D.wall.R.forEach((r, k) => (k ? ctx.lineTo(X(r), Y(D.wall.Z[k])) : ctx.moveTo(X(r), Y(D.wall.Z[k])))); ctx.closePath();
    ctx.fillStyle = "#dfe4ea"; ctx.fill("evenodd");
    path(ctx, D.wall.R, D.wall.Z, true); ctx.lineWidth = 2.2; ctx.strokeStyle = "#47525e"; ctx.stroke();
  }
  const draw = (pred) => {
    const color = pred ? COL.pred : COL.true, sfx = pred ? "_pred" : "", g = (n) => c[n + sfx][i];
    if (!pred || HAS_PRED_BOUNDARY) {
      const [R, Z] = boundary(g); path(ctx, R, Z, true);
      ctx.lineWidth = 2; ctx.strokeStyle = color; ctx.setLineDash(pred ? [7, 4] : []); ctx.stroke(); ctx.setLineDash([]);
    }
    if (!show.pts) return;
    const lim = isLimited(c, i, pred);
    const pt = (kind, rn, zn) => { const R = c[rn + sfx][i], Z = c[zn + sfx][i]; if (R != null && Z != null) marker(ctx, kind, X(R), Y(Z), color, pred); };
    if (!lim) {
      const sp = strikes(c, i, sfx), xr = c["R_x_point" + sfx][i], xz = c["Z_x_point" + sfx][i];
      if (xr != null && sp[0] && sp[1]) { ctx.lineWidth = 1.2; ctx.strokeStyle = color; ctx.setLineDash([3, 3]);
        for (const s of sp) { ctx.beginPath(); ctx.moveTo(X(xr), Y(xz)); ctx.lineTo(X(s[0]), Y(s[1])); ctx.stroke(); } ctx.setLineDash([]); }
      pt("x", "R_x_point", "Z_x_point");
      for (const s of sp) if (s) marker(ctx, "tri", X(s[0]), Y(s[1]), color, pred);
    } else pt("square", "R_limiter", "Z_limiter");
    pt("circle", "R_mag_axis", "Z_mag_axis");
  };
  if (show.true) draw(false);
  if (show.pred) draw(true);
  if (state.hover) {
    ctx.strokeStyle = "rgba(42,111,181,0.55)"; ctx.lineWidth = 1; ctx.setLineDash([4, 4]); ctx.beginPath();
    ctx.moveTo(state.hover.x, v.y0); ctx.lineTo(state.hover.x, v.y0 + v.ph); ctx.moveTo(v.x0, state.hover.y); ctx.lineTo(v.x0 + v.pw, state.hover.y); ctx.stroke(); ctx.setLineDash([]);
  }
  ctx.restore();
  drawAxes(ctx, ticks); drawLegend(ctx);
}

// ---- table -------------------------------------------------------------------------------------
function axisErr(c, i) { return Math.hypot(c.R_mag_axis[i] - c.R_mag_axis_pred[i], c.Z_mag_axis[i] - c.Z_mag_axis_pred[i]) * 1000; }
function drawTable() {
  const c = cur().c, i = state.i, d = cur(), out = [];
  const lt = isLimited(c, i, false), lp = isLimited(c, i, true);
  out.push(`<tr class="grp"><td colspan="5">Konfigurace</td></tr><tr><td>Typ plazmatu</td><td class="u"></td><td class="n t">${lt ? "limiterové" : "divertorové"}</td><td class="n p">${lp ? "limiterové" : "divertorové"}</td><td class="n d">${lt === lp ? "shoda" : "rozdíl"}</td></tr>`);
  let group = "";
  for (const [g, label, name, k, unit, dec] of ROWS) {
    if (g !== group) { out.push(`<tr class="grp"><td colspan="5">${g}</td></tr>`); group = g; }
    const t = value(c, i, name, false), p = value(c, i, name, true), has = t != null && p != null;
    out.push(`<tr><td>${label}</td><td class="u">${unit}</td><td class="n t">${t == null ? "–" : fmt(t * k, dec)}</td><td class="n p">${has ? fmt(p * k, dec) : "–"}</td><td class="n d">${has ? fmtSigned((p - t) * k, dec) : "–"}</td></tr>`);
  }
  $("#rows").innerHTML = out.join("");
  const e = d.c.R_mag_axis.map((_, n) => axisErr(d.c, n)), mean = e.reduce((a, b) => a + b, 0) / e.length, rms = Math.sqrt(e.reduce((a, b) => a + b * b, 0) / e.length);
  $("#sum").innerHTML = `<div><span>Chyba polohy magnetické osy, tento snímek:</span> <b>${fmt(axisErr(c, i), 2)} mm</b></div>` +
    `<div><span>Ve výboji ${d.id}:</span> průměr <b>${fmt(mean, 2)}</b>, RMS <b>${fmt(rms, 2)}</b>, největší <b>${fmt(Math.max(...e), 1)} mm</b></div>`;
}

// ---- error chart -------------------------------------------------------------------------------
const FLAT = ROWS.filter((r) => !r[2].startsWith("sp:"));
const PARAMS = [["axis", "Poloha magnetické osy (mm)"], ...FLAT.map((r) => [r[2], `${r[0] === r[1] ? r[0] : r[0] + ", " + r[1]}${r[4] ? " (" + r[4] + ")" : ""}`])];
function series(param) {
  const c = cur().c, n = cur().n, out = [];
  for (let i = 0; i < n; i++) {
    if (param === "axis") { out.push(axisErr(c, i)); continue; }
    const row = ROWS.find((r) => r[2] === param), t = c[param][i], p = c[param + "_pred"][i];
    out.push(t == null || p == null ? null : (p - t) * row[3]);
  }
  return out;
}
const chart = $("#chart"), cctx = chart.getContext("2d");
let cgeom = null;
function drawChart() {
  const f = fitCanvas(chart), ctx = cctx, s = series(state.param), n = s.length, valid = s.filter((v) => v != null), signed = state.param !== "axis";
  const c = cur().c, L = 56, R = 14, T = 10, B = 30, W = f.w - L - R, H = f.h - T - B;
  cgeom = { L, W, n };
  ctx.setTransform(f.dpr, 0, 0, f.dpr, 0, 0); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, f.w, f.h);
  if (!valid.length) { ctx.fillStyle = COL.muted; ctx.font = FONT; ctx.fillText("Pro tento výboj tento parametr neexistuje (platí jen pro jednu z konfigurací).", L, T + 24); $("#chartStats").textContent = ""; return; }
  const sorted = [...valid].map(Math.abs).sort((a, b) => a - b), cap = (sorted[Math.floor(0.97 * (sorted.length - 1))] || 1) * 1.35;
  const lo = signed ? -cap : 0, hi = cap, px = (i) => L + (i / Math.max(1, n - 1)) * W, py = (v) => T + H - ((clamp(v, lo, hi) - lo) / (hi - lo)) * H;
  // background bands: the limiter configuration is shaded, each phase is named when it is wide enough
  const segs = []; let s0 = 0;
  for (let i = 1; i <= n; i++) if (i === n || (c.is_limited[i] > 0.5) !== (c.is_limited[s0] > 0.5)) { segs.push([s0, i - 1, c.is_limited[s0] > 0.5]); s0 = i; }
  for (const [a, b, lim] of segs) {
    if (lim) { ctx.fillStyle = COL.band; ctx.fillRect(px(a), T, px(b) - px(a) + 1, H); }
    if (px(b) - px(a) > 80) { ctx.fillStyle = "#7a8794"; ctx.font = "11px 'Segoe UI', Arial, sans-serif"; ctx.textAlign = "left"; ctx.fillText(lim ? "limiterová" : "divertorová", px(a) + 6, T + 13); }
  }
  const ty = niceTicks(lo, hi, 4), tx = niceTicks(0, 1, 5);
  ctx.strokeStyle = COL.grid; ctx.lineWidth = 1; ctx.beginPath();
  for (const v of ty.major) { ctx.moveTo(L, Math.round(py(v)) + 0.5); ctx.lineTo(L + W, Math.round(py(v)) + 0.5); }
  for (const v of tx.major) { const x = Math.round(L + v * W) + 0.5; ctx.moveTo(x, T); ctx.lineTo(x, T + H); }
  ctx.stroke();
  if (signed) { ctx.strokeStyle = "#8d99a6"; ctx.beginPath(); ctx.moveTo(L, py(0) + 0.5); ctx.lineTo(L + W, py(0) + 0.5); ctx.stroke(); }
  ctx.beginPath(); let open = false;
  s.forEach((v, i) => { if (v == null) { open = false; return; } open ? ctx.lineTo(px(i), py(v)) : ctx.moveTo(px(i), py(v)); open = true; });
  ctx.lineWidth = 1.6; ctx.strokeStyle = COL.pred; ctx.stroke();
  ctx.strokeStyle = "#222b36"; ctx.lineWidth = 1; ctx.strokeRect(L + 0.5, T + 0.5, W, H);
  ctx.font = FONT; ctx.fillStyle = "#222b36"; ctx.textAlign = "right";
  ctx.beginPath(); for (const v of ty.major) { const y = Math.round(py(v)) + 0.5; ctx.moveTo(L, y); ctx.lineTo(L + 5, y); ctx.fillText(fmt(v, ty.step < 1 ? 2 : ty.step < 10 ? 1 : 0), L - 7, y + 4); } ctx.stroke();
  ctx.textAlign = "center"; ctx.beginPath(); for (const v of tx.major) { const x = Math.round(L + v * W) + 0.5; ctx.moveTo(x, T + H); ctx.lineTo(x, T + H - 5); ctx.fillText(fmt(v, 1), x, T + H + 15); } ctx.stroke();
  ctx.fillText("relativní čas ve výboji", L + W / 2, f.h - 3);
  const x = Math.round(px(state.i)) + 0.5; ctx.strokeStyle = "#2a6fb5"; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(x, T); ctx.lineTo(x, T + H); ctx.stroke();
  const a = valid.map(Math.abs), mean = a.reduce((p, q) => p + q, 0) / a.length;
  $("#chartStats").textContent = `${signed ? "Δ = předpověď − skutečnost · " : ""}průměr |Δ| ${fmt(mean, 2)} · největší |Δ| ${fmt(Math.max(...a), 1)}`;
}
function chartSeek(ev) {
  if (!cgeom) return; const r = chart.getBoundingClientRect();
  state.i = clamp(Math.round(((ev.clientX - r.left - cgeom.L) / cgeom.W) * (cgeom.n - 1)), 0, cgeom.n - 1); render();
}
let dragging = false;
chart.addEventListener("mousedown", (e) => { dragging = true; chartSeek(e); });
window.addEventListener("mousemove", (e) => { if (dragging) chartSeek(e); });
window.addEventListener("mouseup", () => (dragging = false));

// ---- controls ----------------------------------------------------------------------------------
function status() {
  const d = cur(), c = d.c, i = state.i;
  $("#sbFrame").textContent = `Výboj ${d.id} | validační skupina ${d.fold + 1} z 5 | snímek ${i + 1} / ${d.n}`;
  $("#sbModel").textContent = "Předpověď: neuronová síť, výboj nebyl v učení";
  $("#sbWall").textContent = D.wall ? "Obrys stěny: načten" : "Obrys stěny: nenačten";
  $("#cfgTag").textContent = `${isLimited(c, i, false) ? "limiterová" : "divertorová"} konfigurace · t = ${fmt(c.time[i], 3)}`;
  $("#tbox").value = `t = ${fmt(c.time[i], 3)}`;
}
function render() { drawStage(); drawTable(); drawChart(); status(); $("#slider").value = state.i; }
function selectDischarge(idx) { state.di = idx; state.i = 0; $("#slider").max = cur().n - 1; $("#discharge").value = idx; render(); }
function init() {
  $("#discharge").innerHTML = D.discharges.map((d, k) => `<option value="${k}">Výboj ${d.id}   ·   chyba osy ${fmt(d.axisErrMm, 1)} mm   ·   ${Math.round(d.limitedShare * 100)} % limiterová</option>`).join("");
  $("#param").innerHTML = PARAMS.map(([v, l]) => `<option value="${v}">${l}</option>`).join("");
  const q = new URLSearchParams(location.hash.slice(1));
  const byId = q.has("d") ? D.discharges.findIndex((d) => d.id === +q.get("d")) : -1;
  const median = [...D.discharges].sort((a, b) => a.axisErrMm - b.axisErrMm)[Math.floor(D.discharges.length / 2)];
  layoutStage(); selectDischarge(byId >= 0 ? byId : D.discharges.indexOf(median));
  if (q.get("f")) { state.i = clamp(Math.round(+q.get("f") * (cur().n - 1)), 0, cur().n - 1); render(); }
  if (q.get("play") === "1") play(true);
}
let timer = null;
const ICON_PLAY = '<svg viewBox="0 0 14 14"><polygon points="3,1.5 12,7 3,12.5"/></svg>', ICON_PAUSE = '<svg viewBox="0 0 14 14"><rect x="2.5" y="2" width="3" height="10"/><rect x="8.5" y="2" width="3" height="10"/></svg>';
function play(on) {
  state.playing = on; $("#play").innerHTML = on ? ICON_PAUSE : ICON_PLAY; $("#play").classList.toggle("on", on); clearInterval(timer);
  if (on) timer = setInterval(() => { state.i = (state.i + state.speed) % cur().n; render(); }, 33);
}
const step = (k) => { state.i = clamp(state.i + k, 0, cur().n - 1); render(); };
$("#play").onclick = () => play(!state.playing);
$("#first").onclick = () => { state.i = 0; render(); }; $("#last").onclick = () => { state.i = cur().n - 1; render(); };
$("#prev").onclick = () => step(-1); $("#next").onclick = () => step(1);
$("#slider").oninput = (e) => { state.i = +e.target.value; render(); };
$("#discharge").onchange = (e) => selectDischarge(+e.target.value);
$("#speed").onchange = (e) => (state.speed = +e.target.value);
$("#param").onchange = (e) => { state.param = e.target.value; drawChart(); };
for (const [id, key] of [["showTrue", "true"], ["showPred", "pred"], ["showPts", "pts"], ["showGrid", "grid"]]) $("#" + id).onchange = (e) => { show[key] = e.target.checked; drawStage(); };
$("#export").onclick = () => stage.toBlob((b) => { const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = `vyboj${cur().id}_t${cur().c.time[state.i].toFixed(3)}.png`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); });
stage.addEventListener("mousemove", (e) => {
  const r = stage.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  if (x < view.x0 || x > view.x0 + view.pw || y < view.y0 || y > view.y0 + view.ph) { stage.dispatchEvent(new Event("mouseleave")); return; }
  state.hover = { x, y }; const R = view.R0 + (x - view.x0) / view.sc, Z = view.Z1 - (y - view.y0) / view.sc;
  $("#sbCursor").textContent = `R = ${fmt(R, 3)} m   Z = ${fmt(Z, 3)} m`; drawStage();
});
stage.addEventListener("mouseleave", () => { state.hover = null; $("#sbCursor").textContent = "R = –   Z = –"; drawStage(); });
window.addEventListener("keydown", (e) => {
  if (e.target.tagName === "SELECT" || e.target.tagName === "INPUT" && e.target.type === "text") return;
  if (e.code === "Space") { e.preventDefault(); play(!state.playing); }
  if (e.code === "ArrowRight") step(1); if (e.code === "ArrowLeft") step(-1);
  if (e.code === "Home") { state.i = 0; render(); } if (e.code === "End") { state.i = cur().n - 1; render(); }
});
new ResizeObserver(() => { layoutStage(); render(); }).observe(document.querySelector("main"));
init();
</script>
</body>
